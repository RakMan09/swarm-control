listener 1883 0.0.0.0
allow_anonymous true

# Persist QoS 1 messages / sessions so commands to a briefly offline vehicle
# are delivered on reconnect (see P4-SwarmControl.md section 7).
persistence true
persistence_location /mosquitto/data/

max_queued_messages 100000
max_inflight_messages 1000

log_dest stdout
log_type warning
log_type notice
