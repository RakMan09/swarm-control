name: swarmcontrol

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 2 -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/ingestion"]
    environment:
      MQTT_BROKER: tcp://mosquitto:1883
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://swarm:swarm@timescaledb:5432/swarm?sslmode=disable
      INGEST_METRICS_ADDR: ":9101"
    ports:
      - "9101:9101"
    depends_on:
      mosquitto: { condition: service_started }
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }

  alerts:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/alerts"]
    environment:
      MQTT_BROKER: tcp://mosquitto:1883
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://swarm:swarm@timescaledb:5432/swarm?sslmode=disable
      ALERT_METRICS_ADDR: ":9102"
    ports:
      - "9102:9102"
    depends_on:
      redis: { condition: service_healthy }

  command:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/command"]
    environment:
      MQTT_BROKER: tcp://mosquitto:1883
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://swarm:swarm@timescaledb:5432/swarm?sslmode=disable
      COMMAND_HTTP_ADDR: ":8082"
    ports:
      - "8082:8082"
    depends_on:
      mosquitto: { condition: service_started }
      timescaledb: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/api"]
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://swarm:swarm@timescaledb:5432/swarm?sslmode=disable
      API_HTTP_ADDR: ":8081"
      COMMAND_BASE_URL: http://command:8082
    ports:
      - "8081:8081"
    depends_on:
      redis: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
      command: { condition: service_started }

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8081
    ports:
      - "8080:80"
    depends_on:
      api: { condition: service_started }

  sim:
    build:
      context: ./sim
      dockerfile: Dockerfile
    environment:
      MQTT_BROKER_HOSTPORT: mosquitto:1883
      SIM_VEHICLES: "200"
      SIM_RATE_HZ: "1"
      SIM_FAULT_RATE: "0.05"
      SIM_QOS: "0"
    depends_on:
      mosquitto: { condition: service_started }
      ingestion: { condition: service_started }

volumes:
  mosquitto-data:
  timescale-data:
